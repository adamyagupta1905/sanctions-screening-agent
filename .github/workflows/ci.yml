name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # Offline suite only: no API key is available or needed in CI.
      - run: python -m pytest -q
      - run: python -m evaluation.run_eval
      - run: python -m evaluation.injection_eval --no-write
